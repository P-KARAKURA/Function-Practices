<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HABLOCLASS Sign In</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>HABLOCLASS FRIENDS</h1>

        <h2>Welcome!</h2>

        <p> Please, Sign in to Enjoy Practice</p>

        <label for="name">Your Name</label>

        <input 
            type="text"
            id="name"
            placeholder="Enter your name"
        >

        <button id="signInButton"> Join HABLOCLASS
        </button>


        <p id="message"></p>

        <p id="countdown"></p>

        <img
            id="thankYouImage"
            src="thankyou.avif"
            alt="Thank you for joining HABLOCLASS"
        >

        <audio id="music" controls>
            <source src="congratulations.mp3" type="audio/mpeg">
        </audio>

    </div>


    <script src="script.js"></script>

</body>

</html>
